version: '3.8'

# CyPee Zero-Trust Security Enclave for V-Gruvs & App Fleet
# Only CyPee Gateway (Port 3000 / 3050) is accessible from public ingress.
# V-Gruvs, App 1, and App 2 run strictly inside the isolated 'vgruvs_enclave_mesh'.
# Direct unauthorized access bypassing CyPee is mathematically blocked by network isolation
# and cryptographic VG_AUTH_TOKEN validation.

services:
  # 1. CyPee Security Enclave & Multi-App Protective Gateway
  cypee-enclave:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cypee_security_enclave
    ports:
      - "3000:3050" # Public Ingress Gatekeeper
    environment:
      - PORT=3050
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - REDIS_MOCK=true
      - JWT_SECRET=shield-super-secret-jwt-key-change-in-production-2025
      # Enclave Route Mappings
      - VGRUVS_URL=http://vgruvs-core:4000
      - APP1_URL=http://app1-portal:4001
      - APP2_URL=http://app2-api:4002
    networks:
      - public_ingress
      - vgruvs_enclave_mesh
    restart: unless-stopped

  # 2. V-Gruvs Core Platform
  vgruvs-core:
    image: node:20-alpine
    container_name: vgruvs_core_platform
    working_dir: /app
    command: sh -c "echo 'const http=require(\"http\");http.createServer((q,s)=>{s.setHeader(\"content-type\",\"application/json\");s.end(JSON.stringify({service:\"V-Gruvs Core Platform\",status:\"authenticated_and_shielded\",enclaveVerified:q.headers[\"x-cypee-enclave\"]===\"VERIFIED_SECURE\",vgAuthTokenPresent:!!q.headers[\"vg_auth_token\"]}));}).listen(4000);' > server.js && node server.js"
    expose:
      - "4000" # Internal Enclave only!
    networks:
      - vgruvs_enclave_mesh
    restart: unless-stopped

  # 3. Application 1 (e.g. Web Portal / Client Interface)
  app1-portal:
    image: node:20-alpine
    container_name: app1_portal
    working_dir: /app
    command: sh -c "echo 'const http=require(\"http\");http.createServer((q,s)=>{s.setHeader(\"content-type\",\"application/json\");s.end(JSON.stringify({service:\"App 1 - Web Portal\",status:\"online\"}));}).listen(4001);' > server.js && node server.js"
    expose:
      - "4001" # Internal Enclave only!
    networks:
      - vgruvs_enclave_mesh
    restart: unless-stopped

  # 4. Application 2 (e.g. Data & Analytics API)
  app2-api:
    image: node:20-alpine
    container_name: app2_api
    working_dir: /app
    command: sh -c "echo 'const http=require(\"http\");http.createServer((q,s)=>{s.setHeader(\"content-type\",\"application/json\");s.end(JSON.stringify({service:\"App 2 - Data API\",status:\"online\"}));}).listen(4002);' > server.js && node server.js"
    expose:
      - "4002" # Internal Enclave only!
    networks:
      - vgruvs_enclave_mesh
    restart: unless-stopped

networks:
  public_ingress:
    driver: bridge
  vgruvs_enclave_mesh:
    internal: true # Disallows external inbound packets; all traffic MUST pass CyPee inspection
